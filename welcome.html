<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        /* Basic Reset */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        /* Body Style */

        body {

            font-family: Arial, sans-serif;
            background-size: cover;
            background-image: url("background-image.png");
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

        }

        .container {
            padding: 20px;
            border-radius: 8px;
            width: 100%;
        }

        /* Header Style */

        h1 {

            text-align: center;

            margin-bottom: 20px;
            font-size: 40px;
            color: #e4e8e9;

        }

        /* Link Style */

        a {

            color: #007bff;

            text-decoration: none;

            text-align: center;

            margin-top: 10px;

        }

        a:hover {

            text-decoration: underline;
        }

        p {
            text-align: center;
            font-size: 20px;
            color: #f7fbfc;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #eaebe2;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>You have successfully logged in</p>
        <button>Home Page</button>
    </div>
</body>
</html>
